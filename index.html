<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Raper Scissor</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Chakra+Petch:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
  </head>
  <body>


    <h1>Rock Paper Scissor</h1>
    <p class="condition">you have 3 chance to complete the game</p>
    <div class="groupe">
      <div class="scoreEach">

        <p class="scoreplayer">0</p>
        <p class="scorecomputer">0</p>
      </div>
      <div class="battle">
        <section class="Player">❔</section>
        <p>VS</p>
        <section class="Computer">❔</section>
      </div>
      <div class="names">
        <p>Player</p>
        <p>Computer</p>
      </div>
     
      <div class="selection">
        <section class="Rock">✊</section>
        <section class="Paper">🖐</section>
        <section class="Scissor">✌️</section>
      </div>
    </div>
    <div class="alert">
      <p>ssss</p>
      <a href="">Start Again</a>
    </div>
  </body>
      
  <script src="script.js"></script>
</html>
